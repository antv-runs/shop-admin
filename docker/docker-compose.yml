services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: shop-admin-app
    container_name: shop-admin-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ..:/var/www
    depends_on:
      - mysql
      - redis
    networks:
      - shop-admin-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: shop-admin-nginx
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ..:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - shop-admin-network

  mysql:
    image: mysql:8.0
    container_name: shop-admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-shop_admin}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shop-admin-network

  redis:
    image: redis:alpine
    container_name: shop-admin-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - shop-admin-network

  queue:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: shop-admin-app
    container_name: shop-admin-queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ..:/var/www
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - shop-admin-network

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: shop-admin-app
    container_name: shop-admin-scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ..:/var/www
    command: php artisan schedule:work
    depends_on:
      - app
    networks:
      - shop-admin-network

  node:
    image: node:20-alpine
    container_name: shop-admin-node
    working_dir: /var/www
    volumes:
      - ..:/var/www
    command: tail -f /dev/null
    ports:
      - "5173:5173"
    networks:
      - shop-admin-network

networks:
  shop-admin-network:
    name: shop-admin-network

volumes:
  mysql_data:
  redis_data:
